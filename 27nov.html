<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


<h1>this is fetch method </h1>


<div id="box">

</div>



<script>

fetch("https://jsonplaceholder.typicode.com/users")
.then(res=>res.json())
.then(data=>document.getElementById("box").innerHTML=data.map(p=>
    `<h1>${p.name}</h1>
    <p>${p.email}</p>
    `
))
.catch(err=>console.log(err))



</script>
    
</body>
</html>
